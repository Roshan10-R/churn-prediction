name: CI/CD Pipeline

# Runs on every push/PR to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Uncomment when enabling GHCR image publishing.
# env:
#   IMAGE_NAME: ghcr.io/${{ github.repository }}/churn-api

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ---------------------- DEBUG STEP ----------------------
      - name: Debug model loading
        run: |
          echo "Current directory:"
          pwd

          echo "Repository contents:"
          ls -la

          echo "Models directory:"
          ls -la models

          python -c "from src.config import MODEL_PATH; print('MODEL_PATH =', MODEL_PATH)"
          python -c "import os; print('models/best_model.pkl exists =', os.path.exists('models/best_model.pkl'))"
          python -c "from src.config import MODEL_PATH; import os; print('MODEL_PATH exists =', os.path.exists(MODEL_PATH))"

      # ---------------------- TESTS ----------------------
      - name: Run tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests -v -s
      # ---------------------- DOCKER BUILD ----------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      
                # ---------------------- LOGIN TO GHCR ----------------------
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------- IMAGE METADATA ----------------------
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/churn-api
          tags: |
            type=sha
            type=raw,value=latest

      # ---------------------- BUILD & PUSH ----------------------
      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
