name: CI/CD Pipeline

# Runs on every push/PR to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Uncomment when enabling GHCR image publishing.
# env:
#   IMAGE_NAME: ghcr.io/${{ github.repository }}/churn-api

jobs:
  # ---------------------------------------------------------------------
  # Stage 1: Verify the project builds and tests successfully.
  # ---------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests -v

